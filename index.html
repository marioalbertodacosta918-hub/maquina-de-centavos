<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquina de Centavos</title>
</head>

<body>

  <h1>🪙 Máquina de Centavos</h1>

  <p>Acumule centavos jogando.</p>

  <h2>Saldo</h2>
  <p id="saldo">R$ 0,00</p>

  <button id="jogar">JOGAR</button>

  <p id="mensagem"></p>

  <script>
    let saldo = parseFloat(localStorage.getItem("saldo")) || 0;

    const saldoTela = document.getElementById("saldo");
    const botao = document.getElementById("jogar");
    const mensagem = document.getElementById("mensagem");

    saldoTela.textContent = saldo.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

    botao.addEventListener("click", function () {
      saldo += 0.01;

      localStorage.setItem("saldo", saldo);

      saldoTela.textContent = saldo.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });

      mensagem.textContent = "Você ganhou R$ 0,01!";
    });
  </script>
<button onclick="ganharCentavo()">🪙 Ganhar 1 centavo</button>

<script>
function ganharCentavo() {
  let saldo = localStorage.getItem("saldo") || "1.27";
  saldo = parseFloat(saldo) + 0.01;
  localStorage.setItem("saldo", saldo.toFixed(2));
  alert("Você ganhou 1 centavo! Saldo: R$ " + saldo.toFixed(2).replace(".", ","));
}
</script>
</body>
</html>
